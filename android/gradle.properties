org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2,TLSv1.3
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- CONFIGURE AQUI (ou passe com -PpanelUrl=... no comando de build) ----
# Endereço do seu painel BoxTv (o servidor da pasta /panel).
# - Para Emulador do Android Studio: use http://10.0.2.2:8080 ou o IP da máquina
# - Para Celular ou TV Android física: use o IP da sua máquina na rede Wi-Fi: http://192.168.2.110:8080
# - Em produção na internet: use https://seu-dominio.com
panelUrl=https://boxtv-panel.onrender.com
# Segredo que ajuda a gerar o MAC/chave do app. Troque por um texto seu e NÃO mude depois de
# publicar (se mudar, todos os aparelhos ganham MAC novo).
idSalt=troque-este-segredo
# Servidor Xtream que já vem preenchido no login. Deixe vazio para o cliente digitar o dele.
xtreamUrl=http://trevorcdn.online:80
# Identificação (User-Agent) que o app envia ao baixar os vídeos.
streamUa=VLC/3.0.20 LibVLC/3.0.20

# Build estável em máquinas diferentes
org.gradle.parallel=false
org.gradle.caching=true
