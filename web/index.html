<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070711">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="referrer" content="no-referrer">
  <title>BoxTv</title>
  <link rel="icon" href="boxtv-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261120h">
</head>

<body>
  <div id="splash"
    style="position:fixed;inset:0;background:#070711;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;transition:opacity .5s ease;pointer-events:none">
    <div
      style="width:72px;height:72px;background:linear-gradient(135deg,#7c3aed,#ff4081);border-radius:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 35px rgba(124,58,237,.6);animation:splashPulse 1.2s infinite ease-in-out">
      <span style="color:#fff;font-size:28px;font-weight:900;margin-left:4px">▶</span>
    </div>
    <div
      style="font-family:'Poppins',sans-serif;font-size:1.8rem;font-weight:900;color:#fff;margin-top:16px;letter-spacing:-0.5px">
      Box<span style="color:#ff4081">Tv</span></div>
    <div
      style="font-family:'Inter',sans-serif;font-size:0.8rem;color:#7c3aed;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-top:4px">
      O melhor do entretenimento</div>
  </div>
  <script>
    (function() {
      function dismissSplash() {
        var s = document.getElementById('splash');
        if (!s) return;
        s.style.opacity = '0';
        setTimeout(function() { if (s && s.parentNode) s.remove(); }, 500);
      }
      window.addEventListener('DOMContentLoaded', function() { setTimeout(dismissSplash, 900); });
      window.addEventListener('load', function() { setTimeout(dismissSplash, 400); });
      setTimeout(dismissSplash, 2000);
    })();
  </script>
  <style>
    @keyframes splashPulse {

      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 0 25px rgba(124, 58, 237, .5);
      }

      50% {
        transform: scale(1.08);
        box-shadow: 0 0 45px rgba(255, 64, 129, .7);
      }
    }
  </style>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="config.js?v=20261120h"></script>
  <script type="module" src="js/main.js?v=20261120h"></script>
  <noscript>Ative o JavaScript para usar o aplicativo.</noscript>
</body>

</html>
