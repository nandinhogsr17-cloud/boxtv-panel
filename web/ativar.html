<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0f">
<meta name="referrer" content="no-referrer">
<title>Ativar lista</title>
<link rel="stylesheet" href="style.css">
<style>
  .form{display:grid;gap:12px;text-align:left}
  .form label{font-size:.85rem;color:var(--dim);display:grid;gap:6px}
  .form input,.form textarea{width:100%;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg2);font-size:1rem}
  .form input:focus,.form textarea:focus{border-color:var(--txt);outline:none}
  .form .mono{text-transform:uppercase}
  .form textarea{min-height:84px;resize:vertical;word-break:break-all}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;padding:10px;border-radius:10px;background:var(--card);color:var(--dim);font-weight:600}
  .seg button.on{background:var(--txt);color:#000}
  .ok{background:#0f2a1c;border:1px solid #1d6b43;border-radius:12px;padding:16px;text-align:left}
  .bad{background:#2a1215;border:1px solid #7a2630;border-radius:12px;padding:16px;text-align:left}
  .warn{background:#2a2410;border:1px solid #7a6526;border-radius:12px;padding:12px;margin-top:10px;font-size:.9rem;text-align:left}
  .stats{display:flex;gap:18px;margin:10px 0 0;flex-wrap:wrap}
  .stats b{display:block;font-size:1.5rem}
  .foot{margin-top:22px;font-size:.85rem;color:var(--dim)}
</style>
</head>
<body>
<div class="act"><div class="box">
  <div class="brand" style="font-size:1.6rem;margin-bottom:14px">▶ Ativar lista</div>
  <h1 style="font-size:1.5rem">Coloque a sua lista no aparelho</h1>
  <p class="dim">Digite o <b>MAC</b> e a <b>chave</b> que aparecem na tela do aplicativo e a sua lista. O aplicativo abre sozinho quando a lista estiver funcionando.</p>
  <form id="f" class="form big" autocomplete="off" novalidate>
    <label>MAC<input id="mac" class="mono" placeholder="02:AB:CD:EF:12:34" inputmode="text" autocapitalize="characters" spellcheck="false" required></label>
    <label>Chave<input id="key" class="mono" placeholder="8 letras e números" autocapitalize="characters" spellcheck="false" required></label>
    <div class="seg" role="tablist">
      <button type="button" id="tabLogin" class="hidden">Usuário e senha</button>
      <button type="button" id="tabUrl" class="on">Link da lista (M3U)</button>
      <button type="button" id="tabX">Servidor, usuário e senha</button>
    </div>
    <div id="boxLogin" style="display:none;gap:12px">
      <label>Usuário<input id="luser" autocapitalize="none" spellcheck="false" autocomplete="off"></label>
      <label>Senha<input id="lpass" autocapitalize="none" spellcheck="false" autocomplete="off"></label>
    </div>
    <div id="boxUrl"><label>Link da lista<textarea id="url" placeholder="http://servidor.com:8080/get.php?username=...&password=...&type=m3u_plus" spellcheck="false"></textarea></label></div>
    <div id="boxX" class="hidden" style="display:grid;gap:12px">
      <label>Servidor<input id="host" placeholder="http://servidor.com:8080" spellcheck="false"></label>
      <label>Usuário<input id="user" spellcheck="false" autocomplete="off"></label>
      <label>Senha<input id="pass" spellcheck="false" autocomplete="off"></label>
    </div>
    <button class="btn primary" id="go" type="submit" style="justify-content:center">Verificar e ativar</button>
  </form>
  <div id="out" role="status" aria-live="polite"></div>
  <p class="foot">Só quem tem o MAC e a chave do aparelho consegue ativar. Seus dados não ficam salvos neste site.</p>
</div></div>
<script src="config.js"></script>
<script type="module" src="js/ativar.js"></script>
</body>
</html>
