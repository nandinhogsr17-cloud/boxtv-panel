services:
  - type: web
    name: boxtv-panel
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: node --max-old-space-size=400 server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: WEB_SECRET
        generateValue: true
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: AUTO_REGISTER
        value: "1"
      - key: SELF_ACTIVATE
        value: "0"
      - key: SELF_DAYS
        value: "0"
      - key: SELF_REPLACE
        value: "1"
      - key: DEFAULT_XTREAM_HOST
        value: "http://trevorcdn.online:80"
      - key: M3U_TEMPLATE
        value: "http://trevorcdn.online:80/get.php?username={user}&password={pass}&type=m3u_plus&output=ts"
      - key: SNAPSHOT_URL
        sync: false
      - key: SNAPSHOT_TOKEN
        sync: false
      - key: EXTRA_M3U_URL
        sync: false
      - key: MSX_USER
        sync: false
      - key: MSX_PASS
        sync: false
