services:
  - type: web
    name: boxtv-panel
    runtime: node
    plan: free
    region: oregon
    buildCommand: ""
    startCommand: node --max-old-space-size=400 server.js
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: ADMIN_USER
        value: admin
      - key: TRUST_PROXY
        value: "1"
      - key: AUTO_REGISTER
        value: "1"
      - key: SELF_ACTIVATE
        value: "1"
      - key: SELF_DAYS
        value: "0"
      - key: SELF_REPLACE
        value: "1"
      - key: DEFAULT_XTREAM_HOST
        value: "http://trevorcdn.online:80"
